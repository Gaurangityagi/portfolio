<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaurangi Tyagi — Data Analyst</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&family=Bagel+Fat+One&family=Anton&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f1ef; --ink:#1d1c1a; --muted:#6b6862; --line:#cfccc6;
  --hl:#fbeea0; --red:#e8443a; --pink:#f59fc9; --yellow:#f6dc6b; --green:#8fe0a6; --peri:#b9c6f5; --plum:#2a1438;
  --serif:'Instrument Serif',Georgia,serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.6}
a{color:inherit}
mark{background:var(--hl);color:inherit;padding:0 2px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* pin dots */
#dots{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#dots i{position:absolute;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#d9d6d1 60%,#c7c3bd);box-shadow:0 1px 1px rgba(0,0,0,.08);transition:transform .6s cubic-bezier(.2,.7,.2,1)}

.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:36px 64px 80px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;min-height:110px}
h1.title{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(44px,6.4vw,78px);line-height:.95;letter-spacing:-1px}
.sub{margin-top:14px;max-width:460px;color:#3a3833}

/* sticker nav */
nav.stickers a{text-decoration:none}
nav.stickers{display:flex;align-items:flex-start;gap:14px;flex-shrink:0;position:relative;
  border:1.5px solid var(--ink);border-radius:16px;background:#fffdfa;
  padding:16px 18px 12px;box-shadow:5px 5px 0 var(--ink)}
nav.stickers::before{content:"SECTIONS →";position:absolute;top:-10px;left:16px;
  background:var(--ink);color:#fff;font-size:9px;letter-spacing:1.8px;padding:3px 10px;border-radius:12px}
.stk{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
.art{position:relative;height:78px;display:grid;place-items:center;
  transition:transform .25s cubic-bezier(.3,1.6,.5,1);filter:drop-shadow(0 2px 0 rgba(0,0,0,.18))}
.stk:hover .art{transform:rotate(-6deg) scale(1.08)}
.stk.active .art{transform:rotate(3deg) scale(1.04)}
.navcap{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);
  white-space:nowrap;padding:2px 9px;border-radius:20px;border:1.5px solid transparent;transition:.18s}
.stk:hover .navcap{color:var(--ink);border-color:var(--ink);background:#fff}
.stk.active .navcap{background:var(--hl);color:var(--ink);font-weight:700;
  border-color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.s-about{width:78px;height:78px;display:grid;place-items:center}
.s-about svg{position:absolute;inset:0}
.s-about span{position:relative;font-family:var(--serif);font-size:19px}
.s-side{width:78px;height:78px;background:var(--red);color:#fff;padding:7px 6px;text-align:center;outline:4px dotted var(--bg);outline-offset:-2px}
.s-side .a{font-family:var(--serif);font-style:italic;font-size:19px;line-height:1;display:block;color:#ffe4dc}
.s-side .b{font-family:Anton,sans-serif;font-size:18px;line-height:1.05;letter-spacing:.5px;display:block}
.s-side .c{font-size:13px;letter-spacing:2px;display:block;margin-top:1px}
.s-work{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:78px}
.s-work .tag{background:var(--yellow);border:2px solid var(--ink);font-family:var(--serif);font-style:italic;font-size:13px;padding:0 8px;line-height:1.5;transform:rotate(-2deg)}
.s-work .pill{background:var(--pink);border:2px solid var(--ink);border-radius:30px;padding:2px 16px;font-family:'Bagel Fat One',sans-serif;font-size:20px;color:#fff;-webkit-text-stroke:1.2px var(--ink);letter-spacing:1px}
.s-reach{width:78px;height:78px;background:var(--green);border:2px solid var(--ink);border-radius:4px;display:flex;flex-direction:column;justify-content:space-between;padding:5px;overflow:hidden}
.s-reach .cam{height:40px;background:var(--ink);border-radius:2px;display:grid;place-items:center}
.s-reach span{font-family:var(--serif);font-size:14px;line-height:1;color:#0f3d1e;white-space:nowrap}

/* social rail */
.rail{position:fixed;right:max(18px,calc(50% - 600px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;z-index:5}
.rail a{width:24px;height:24px;border-radius:5px;background:var(--ink);display:grid;place-items:center;transition:transform .2s}
.rail a:hover{transform:scale(1.15) rotate(-8deg)}
.rail svg{width:13px;height:13px;fill:#fff}

.view{display:none;animation:in .45s cubic-bezier(.2,.7,.2,1)}
.view.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ABOUT */
.about-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:56px;margin-top:8px}
.collage{position:relative;height:300px}
.collage .back{position:absolute;left:40px;top:0;width:340px;height:232px;background:var(--plum);padding:20px;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.term{background:#140a1c;height:100%;border-radius:3px;padding:12px 14px;font-size:10.5px;color:#c9b7e0;line-height:1.62;overflow:hidden}
.term .k{color:#f59fc9}.term .s{color:var(--green)}.term .c{color:#7a6890}.term .n{color:var(--yellow)}
.polaroid{position:absolute;left:0;top:96px;width:150px;background:#fff;padding:8px 8px 26px;transform:rotate(-5deg);box-shadow:0 8px 22px rgba(0,0,0,.18);transition:transform .3s}
.polaroid:hover{transform:rotate(-1deg) scale(1.03)}
.polaroid .ph{height:150px;background:repeating-linear-gradient(45deg,#e7e3dc 0 6px,#efece6 6px 12px);display:grid;place-items:center;color:#8f8a80;font-size:10px;text-align:center;overflow:hidden}
.polaroid .ph img{width:100%;height:100%;object-fit:cover}
.polaroid em{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-family:var(--serif);font-size:15px}
.label-tape{display:inline-block;background:#e9a6a0;color:#6b1f1a;font-weight:700;letter-spacing:1px;font-size:16px;padding:4px 12px;transform:rotate(-2deg);margin:18px 0 14px;box-shadow:0 2px 0 rgba(0,0,0,.1)}
.bio p{margin-bottom:12px;max-width:440px}
.right-col{display:flex;flex-direction:column;gap:26px;padding-bottom:6px}
.kicker{font-size:11px;font-weight:700;letter-spacing:1px;margin-bottom:10px}
.grp{margin-bottom:12px}
.grp small{display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--ink);border-radius:20px;padding:1px 10px;font-size:11px;background:#fff}
.chip.dim{border-color:var(--line);color:var(--muted);background:transparent}
.exp .item{border-left:2px solid var(--ink);padding-left:12px;margin-bottom:16px}
.exp .item b{font-size:12.5px}
.exp .item .when{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.exp .item ul{list-style:none;margin-top:5px}
.exp .item li{padding-left:14px;position:relative;color:#3a3833}
.exp .item li::before{content:"→";position:absolute;left:0}
.certs .c-row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dotted var(--line);padding:7px 0}
.certs .c-row:last-child{border-bottom:0}
.certs .c-row span{color:var(--muted);font-size:10.5px;white-space:nowrap;letter-spacing:.5px;text-transform:uppercase}
.certs a{text-decoration:none;border-bottom:1px solid var(--ink)}
.certs a:hover b{background:var(--hl)}
.edu{background:#fff;border:1.5px solid var(--ink);padding:10px 14px;max-width:440px;box-shadow:3px 3px 0 var(--ink);margin-top:4px}
.edu small{display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}

/* SIDE QUESTS */
.scene-wrap{position:relative;margin-top:10px}
.scene{width:100%;max-width:820px;display:block;margin:0 auto;overflow:visible}
.hot{cursor:pointer;transition:transform .25s cubic-bezier(.3,1.6,.5,1);transform-box:fill-box;transform-origin:center bottom}
.hot:hover{transform:translateY(-4px) scale(1.04)}
.tip{position:absolute;pointer-events:none;background:#fff;border:1.5px solid var(--ink);border-radius:20px;padding:3px 12px;font-size:11px;white-space:nowrap;opacity:0;transform:translate(-50%,-6px);transition:opacity .15s,transform .15s;z-index:3}
.tip.show{opacity:1;transform:translate(-50%,-14px)}
.zz text{font-family:var(--mono);font-size:13px;fill:var(--ink);animation:zz 3s infinite}
.zz text:nth-child(2){animation-delay:1s}.zz text:nth-child(3){animation-delay:2s}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(10px,-22px)}}
.cat-body{animation:breathe 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
@keyframes breathe{50%{transform:scaleY(1.05)}}
.bar-grow{transform-box:fill-box;transform-origin:center bottom;animation:grow 3.6s ease-in-out infinite}
.bar-grow.d1{animation-delay:.3s}.bar-grow.d2{animation-delay:.6s}
@keyframes grow{50%{transform:scaleY(.72)}}

/* WORK */
.cta{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;font-size:11px;letter-spacing:1px;padding:6px 12px;margin-top:14px;border-radius:2px;transition:transform .2s;text-decoration:none}
.cta:hover{transform:translateY(-2px)}
.bar{display:flex;justify-content:space-between;align-items:center;margin:44px 0 14px;font-size:11px;letter-spacing:.5px;gap:16px;flex-wrap:wrap}
.filters button{color:#b0aca5;text-transform:uppercase;font-size:11px}
.filters button.on{color:var(--ink)}
.filters .sep{color:#c9c5be;margin:0 6px}
.toggle{display:flex;align-items:center;gap:8px;text-transform:uppercase;color:#b0aca5}
.toggle .on{color:var(--ink)}
.sw{width:30px;height:16px;border-radius:10px;background:#fff;border:1.5px solid var(--ink);position:relative}
.sw::after{content:"";position:absolute;top:1px;left:1px;width:11px;height:11px;border-radius:50%;background:var(--ink);transition:left .25s}
.sw.cs{background:var(--ink)}.sw.cs::after{left:15px;background:#fff}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{position:relative;aspect-ratio:16/11;overflow:hidden;cursor:pointer;background:#111}
.card .vis{position:absolute;inset:0;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.card:hover .vis{transform:scale(1.035)}
.card .cap{position:absolute;left:12px;bottom:12px;background:var(--hl);border:1.5px solid var(--ink);border-radius:20px;padding:3px 14px;font-size:12px;font-weight:700;letter-spacing:.2px;box-shadow:2px 2px 0 var(--ink);transition:.2s}
.card:hover .cap{background:#fff;transform:translateY(-3px)}
.card .yr{position:absolute;right:12px;top:12px;background:var(--ink);color:#fff;border-radius:20px;padding:2px 10px;font-size:10px;letter-spacing:.5px}
.cases .row{display:grid;grid-template-columns:200px 1fr 150px;gap:24px;align-items:stretch;border-top:1px solid var(--ink);padding:16px 0 24px;cursor:pointer}
.cases .num{font-size:12px;color:var(--muted)}
.cases h3{font-family:var(--serif);font-style:italic;font-weight:400;font-size:38px;line-height:1.02;margin:22px 0 10px}
.cases .kind{font-size:12px}
.cases .thumb{position:relative;aspect-ratio:16/9;max-width:340px;overflow:hidden;background:#111}
.cases .go{display:flex;align-items:flex-end;justify-content:flex-end;gap:10px;font-size:12px}
.cases .go .ln{flex:1;height:1px;background:var(--ink);margin-bottom:8px;max-width:60px;transition:max-width .3s}
.cases .row:hover .ln{max-width:90px}
.cases .go .circ{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;opacity:0;transform:scale(.6);transition:.25s;margin-bottom:-6px}
.cases .row:hover .circ{opacity:1;transform:none}

/* project visuals (generic) */
.v{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.v svg{width:100%;height:100%}

/* modal */
.modal{position:fixed;inset:0;background:rgba(20,18,16,.82);z-index:20;display:none;align-items:center;justify-content:center;padding:28px}
.modal.on{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.mbox{background:var(--bg);width:min(980px,100%);max-height:92vh;overflow:auto;display:grid;grid-template-columns:1.25fr 1fr;position:relative}
.mvis{position:relative;min-height:380px;background:#111}
.mtext{padding:28px 28px 30px}
.mtext h2{font-family:var(--serif);font-style:italic;font-weight:400;font-size:38px;line-height:1.05;margin:6px 0 10px}
.meta{font-size:11px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}
.mtext ul{list-style:none;margin:14px 0}
.mtext li{padding-left:16px;position:relative;margin-bottom:6px}
.mtext li::before{content:"→";position:absolute;left:0}
.mlinks{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.mlinks a{border:1.5px solid var(--ink);padding:3px 10px;font-size:11px;text-decoration:none;background:#fff}
.mlinks a:hover{background:var(--ink);color:#fff}
.x{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:#fff;border:1.5px solid var(--ink);z-index:2;font-size:15px}
.gbox{background:var(--bg);width:min(1000px,100%);max-height:92vh;overflow:auto;position:relative;border:1.5px solid var(--ink);box-shadow:8px 8px 0 rgba(0,0,0,.35)}
.ghead{padding:30px 30px 18px;border-bottom:1.5px solid var(--ink);background:var(--peri)}
.ghead h2{font-family:var(--serif);font-style:italic;font-weight:400;font-size:40px;line-height:1.05;margin:6px 0 10px}
.ghead p{max-width:64ch;font-size:14px}
.gbody{padding:4px 30px 30px}
.gcard{display:grid;grid-template-columns:230px 1fr;gap:22px;padding:22px 0;border-bottom:1px solid var(--line);cursor:pointer;align-items:start}
.gcard:last-child{border-bottom:0}
.gthumb{position:relative;aspect-ratio:16/11;overflow:hidden;background:#111;border:1.5px solid var(--ink)}
.gthumb .vis{position:absolute;inset:0;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.gcard:hover .gthumb .vis{transform:scale(1.04)}
.gcard h3{font-family:var(--serif);font-style:italic;font-weight:400;font-size:27px;line-height:1.08;margin:2px 0 4px}
.gcard:hover h3{background:var(--hl);box-shadow:0 0 0 4px var(--hl)}
.gcard .gk{font-size:11px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}
.gcard p{font-size:13.5px;margin:8px 0 0}
.gcard ul{list-style:none;margin:10px 0 0}
.gcard li{padding-left:16px;position:relative;margin-bottom:5px;font-size:13px}
.gcard li::before{content:"→";position:absolute;left:0}
.gcard .gmore{font-size:11.5px;margin-top:10px;border-bottom:1.5px solid var(--ink);display:inline-block}
@media(max-width:760px){.gcard{grid-template-columns:1fr}.ghead h2{font-size:30px}}
.navarr{position:fixed;top:50%;width:38px;height:38px;border-radius:50%;background:#111;color:#fff;border:1px solid #444;z-index:21;display:none}

/* resume viewer */
.pdfm{position:fixed;inset:0;background:rgba(20,18,16,.86);z-index:40;display:none;align-items:center;justify-content:center;padding:24px}
.pdfm.on{display:flex;animation:fade .2s}
.pdfbox{background:var(--bg);width:min(900px,100%);height:min(94vh,100%);display:flex;flex-direction:column;border:1.5px solid var(--ink);box-shadow:8px 8px 0 rgba(0,0,0,.35)}
.pb-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-bottom:1.5px solid var(--ink);background:var(--green)}
.pb-top b{font-family:var(--serif);font-style:italic;font-weight:400;font-size:24px}
.pb-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pb-act a{border:1.5px solid var(--ink);padding:3px 10px;font-size:11px;text-decoration:none;background:#fff}
.pb-act a:hover{background:var(--ink);color:#fff}
.pdfbox iframe{flex:1;width:100%;border:0;background:#fff}
.pb-note{font-size:10.5px;color:var(--muted);padding:6px 14px;border-top:1px solid var(--line)}
.modal.on ~ .navarr.show{display:block}
#prev{left:14px}#next{right:14px}

/* REACH OUT */
.reach{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-top:30px;align-items:start}
.ticket{background:#fff;border:1.5px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:0}
.ticket .top{background:var(--green);border-bottom:1.5px dashed var(--ink);padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.ticket .top b{font-family:var(--serif);font-style:italic;font-weight:400;font-size:28px}
.ticket .row{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid #e6e3dd;gap:12px}
.ticket .row:last-child{border-bottom:0}
.ticket .row small{color:var(--muted);display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase}
.ticket .row a.v2{text-decoration:none;border-bottom:1px solid var(--ink)}
.copy{border:1.5px solid var(--ink);padding:2px 9px;font-size:11px;background:var(--bg)}
.copy:hover{background:var(--ink);color:#fff}
.status{display:flex;gap:8px;align-items:center;margin-bottom:18px}
.dot{width:9px;height:9px;border-radius:50%;background:#2fbf5b;box-shadow:0 0 0 0 rgba(47,191,91,.6);animation:pulse 2s infinite;flex-shrink:0}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(47,191,91,0)}100%{box-shadow:0 0 0 0 rgba(47,191,91,0)}}
.looking p{margin-bottom:12px;max-width:440px}
.roles{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.roles span{font-family:'Bagel Fat One';font-size:15px;padding:3px 12px;border:2px solid var(--ink);border-radius:30px}
.roles span:nth-child(1){background:var(--pink);transform:rotate(-3deg)}
.roles span:nth-child(2){background:var(--yellow);transform:rotate(2deg)}
.roles span:nth-child(3){background:var(--peri);transform:rotate(-1deg)}
.roles span:nth-child(4){background:var(--green);transform:rotate(2deg)}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:6px 14px;font-size:12px;opacity:0;transition:.25s;z-index:30}
.toast.on{opacity:1;transform:translate(-50%,0)}
footer{margin-top:70px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

@media (max-width:860px){
  .wrap{padding:22px 20px 70px}
  header{flex-direction:column-reverse}
  nav.stickers{align-self:center;transform:scale(.9)}
  .about-grid,.reach{grid-template-columns:1fr;gap:28px}
  .collage{height:260px}.collage .back{width:min(340px,80vw);left:30px}
  .gallery{grid-template-columns:1fr}
  .cases .row{grid-template-columns:1fr}
  .cases h3{margin:8px 0}
  .mbox{grid-template-columns:1fr}.mvis{min-height:240px}
  .rail{top:auto;bottom:16px;transform:none;flex-direction:row;right:16px}
}
</style>
</head>
<body>
<div id="dots"></div>

<div class="rail">

const dotsEl=document.getElementById('dots');
let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
for(let i=0;i<46;i++){const d=document.createElement('i');d.style.left=(rnd()*100)+'%';d.style.top=(rnd()*100)+'%';d.dataset.z=(0.3+rnd()*1.2).toFixed(2);dotsEl.appendChild(d)}
addEventListener('mousemove',e=>{const cx=e.clientX/innerWidth-.5,cy=e.clientY/innerHeight-.5;dotsEl.querySelectorAll('i').forEach(d=>{const z=d.dataset.z;d.style.transform=`translate(${cx*-14*z}px,${cy*-14*z}px)`})});

/* scallop badge */
(()=>{let q='';const n=14;for(let i=0;i<n;i++){const a0=i/n*Math.PI*2,a1=(i+.5)/n*Math.PI*2,a2=(i+1)/n*Math.PI*2;const P=(a,r)=>[(50+r*Math.cos(a)).toFixed(1),(50+r*Math.sin(a)).toFixed(1)];const s=P(a0,43),c=P(a1,54),e=P(a2,43);q+=(i?'':'M'+s.join(' '))+' Q'+c.join(' ')+' '+e.join(' ')}
document.getElementById('scallop').setAttribute('d',q+'Z')})();

const gmodal=document.getElementById('gmodal');
function openGroup(q){
  document.getElementById('gmeta').textContent=q.kind+' · '+q.year;
  document.getElementById('gtitle').textContent=q.title;
  document.getElementById('gblurb').innerHTML=q.blurb;
  document.getElementById('gbody').innerHTML=q.group.map((p,i)=>
    '<div class="gcard" data-i="'+i+'">'
    +'<div class="gthumb"><div class="vis">'+(V[p.vis]||'')+'</div></div>'
    +'<div><div class="gk">'+p.kind+' · '+p.year+'</div><h3>'+p.title+'</h3>'
    +'<p>'+p.blurb+'</p>'
    +'<ul>'+p.points.slice(0,3).map(x=>'<li>'+x+'</li>').join('')+'</ul>'
    +'<span class="gmore">Open project ↗</span></div></div>').join('');
  document.getElementById('gbody').querySelectorAll('.gcard').forEach(el=>{
    el.onclick=()=>openP(q.group,+el.dataset.i);
  });
  gmodal.classList.add('on');
}
function closeG(){gmodal.classList.remove('on')}
document.getElementById('gclose').onclick=closeG;
gmodal.onclick=e=>{if(e.target===gmodal)closeG()};
addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.classList.contains('on')&&gmodal.classList.contains('on'))closeG()},true);

renderFilters();renderWork();route();
</script>
</body>
</html>
